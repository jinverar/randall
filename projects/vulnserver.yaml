name: vulnserver
description: Randall custom vulnserver — TCP lab target (build with scripts/build-vulnserver.ps1)
kind: tcp
target:
  executable: ../targets/vulnserver/randall-vulnserver.exe
  longLived: true
  timeoutMs: 5000
transport:
  type: tcp
  host: 127.0.0.1
  port: 9999
  receiveTimeoutMs: 1500
sessionCommands:
  - name: TRUN
    model: protocols/vulnserver_trun.yaml
    readBanner: true
  - name: GMON
    model: protocols/vulnserver_gmon.yaml
    readBanner: true
  - name: GTER
    model: protocols/vulnserver_gter.yaml
    readBanner: true
  - name: KSTET
    model: protocols/vulnserver_kstet.yaml
    readBanner: true
  - name: HTER
    model: protocols/vulnserver_hter.yaml
    readBanner: true
  - name: STAT_TRUN
    model: protocols/vulnserver_trun.yaml
    preamble: "STAT\r\n"
    readBanner: true
  - name: RAND
    model: protocols/vulnserver_rand.yaml
    readBanner: true
fuzz:
  # brain: true is the code default — RandallBrain fuses frontier/Ghidra/oracle/scream when stalk data exists
  brain: true
  # Scream watcher: debug-attach on crash → minidump under data/crashes/vulnserver/dumps/ (needs longLived target)
  debuggerMode: wait
  maxIterations: 1000
  powerSchedule: true
  havocDepth: 8
  sessionFlowBias: 0.25
  sessionGraphBias: 0.2
  coverageGuided: false
  coverageTcpSpawn: true
  corpusDir: ../data/corpus/vulnserver
  crashesDir: ../data/crashes/vulnserver
dictionaryFile: dictionaries/fuzz.txt
dictionary:
  - "TRUN /.:/"
  - "%s%s%s%s"
sessionFlows:
  - name: stat_trun
    steps:
      - STAT_TRUN
      - TRUN
  - name: gmon_probe
    steps:
      - GMON
sessionGraph:
  start: STAT_TRUN
  mutate: TRUN
  edges:
    - from: STAT_TRUN
      when: "STAT OK"
      to: TRUN
    - from: GMON
      when: "GMON OK"
      to: GTER
seeds:
  - seeds/vulnserver_trun.txt
mutators:
  - bitflip
  - havoc
  - interesting
  - dictionary
  - splice
  - arith
  - expand
  - boundary
  - insert
# Vulnserver has no AuthN and no binary length-prefix framing (commands are ASCII).
# Keep AI auto-arm from injecting auth / length-prefix false positives.
bugHunter:
  enabled: false
  autoArmOracles: false
oracles:
  enabled: true
  authEnabled: false
  auth: []
  integer: []
  persistFindings: true
  retainOnViolation: true
  retainOnNearMiss: false
plugins:
  - path: ../plugins/xor-silly
    hook: mutate
